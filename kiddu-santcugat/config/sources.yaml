# Sources the AI pipeline reads (features 07, 11, 16). Only `enabled: true` + `type: web` sources are fetched.
# Before enabling a source: open its robots.txt and terms of use, and note what you found in `note`.
# The pipeline always identifies itself (KidduBot), obeys robots.txt and waits between requests (config/site.yaml > pipeline).
# Facts (date, place, price) are not copyrighted; descriptions are, so the AI writes its own summary and every item links to its source.

blocklist: []            # domains never fetched, e.g. [example.com]

areas:
  sant-cugat:
    - id: ajuntament-infantils-rss
      name: Ajuntament de Sant Cugat - agenda, category "Infantils" (RSS)
      type: rss
      url: https://www.santcugat.cat/download/agenda.rss?idTipus=7
      enabled: true
      note: Official feed, checked 2026-11-15. robots.txt allows /download/. Structured fields (date, time, venue, coordinates) are used as given; no AI. The town hall's description text is not copied, only facts plus a link.

    - id: ajuntament-agenda
      name: Ajuntament de Sant Cugat - agenda (web page)
      type: web
      url: https://santcugat.cat/web/agenda
      enabled: false
      note: Same events as the RSS feeds, mostly for adults; use the per-category RSS feeds instead (idTipus 7 = Infantils, 11 = Cursos i tallers).

    - id: cugat-en-familia
      name: Cugat.cat - agenda "En família"
      type: web
      url: https://www.cugat.cat/agenda/?tema=en-familia
      enabled: false
      note: Local news media. robots.txt allows it (checked 2026-11-15), but their agenda is their editorial product - ask them for permission first. Most items duplicate the town hall feed; adds some events by other organisers (e.g. sports races).

    - id: totsantcugat-infantil
      name: Tot Sant Cugat - activitats infantils
      type: web
      url: https://www.totsantcugat.cat/activitats/activitats-infantil
      enabled: false
      note: Local newspaper. robots.txt allows it (checked 2026-11-15); ask for permission first. Mostly duplicates the town hall feed.

    - id: biblioteca-gabriel-ferrater
      name: Biblioteca Central Gabriel Ferrater (agenda, Diputació de Barcelona)
      type: web
      url: https://genius.diba.cat/sant-cugat-del-valles-biblioteca-gabriel-ferrater
      enabled: false
      note: Library events already appear in the town hall feed; enable only if some are missing.

    - id: osm-playgrounds
      name: OpenStreetMap playgrounds and parks
      type: overpass
      enabled: false
      note: Not built yet. Places (not events) come better from OpenStreetMap (ODbL, attribution required).

    - id: family-guides
      name: Commercial family guides (Escapada amb nens, Femturisme, Surtdecasa)
      type: web
      url: ""
      enabled: false
      note: Do not ingest without written permission (EU database right).
